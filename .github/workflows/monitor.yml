name: Chrome Hearts new-product scan
on:
  workflow_dispatch:
  schedule:
    - cron: '3/5 * * * *'
permissions:
  contents: write
concurrency:
  group: chrome-hearts-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan official product categories
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py
      - name: Persist successful baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/products.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update product inventory snapshot'
            git push
          fi
